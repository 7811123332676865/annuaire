@if (peopleService.loading()) {
  <p>Chargement de l'annuaire…</p>
} @else if (peopleService.error(); as message) {
  <p class="text-red-700">{{ message }}</p>
} @else {
  <div class="mb-4 flex items-center gap-2">
    <label for="search">Rechercher</label>
    <input
      id="search"
      type="search"
      class="rounded border border-gray-400 bg-white px-2 py-1"
      [formField]="filtersForm.search"
    />
    <label for="gender">Genre</label>
    <select
      id="gender"
      class="rounded border border-gray-400 bg-white px-2 py-1"
      [formField]="filtersForm.gender"
    >
      <option value="all">Tous</option>
      <option value="female">Femmes</option>
      <option value="male">Hommes</option>
    </select>
  </div>
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
    @for (person of visiblePeople(); track person.login.uuid) {
      <app-person-card
        [person]="person"
        [favorite]="favoritesService.isFavorite(person.login.uuid)"
        (toggleFavorite)="favoritesService.toggle($event)"
      />
    } @empty {
      <p>Aucune correspondance.</p>
    }
  </div>
}
